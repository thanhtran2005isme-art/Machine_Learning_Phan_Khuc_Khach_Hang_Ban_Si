      <use data-icon="phosphor-duotone/check-circle" x="890" y="365" width="24" height="24" fill="#10B981"/>
      <text x="925" y="385">40/40 E2E on Server 2025</text>
      
      <use data-icon="phosphor-duotone/check-circle" x="890" y="395" width="24" height="24" fill="#10B981"/>
      <text x="925" y="415">Batch smoke test</text>
    </g>
  </g>
  
  <!-- Gate 10.3 Card -->
  <g id="gate10" data-pptx-bounds="60 480 560 160">
    <rect x="60" y="480" width="560" height="160" rx="12" fill="#DCFCE7" stroke="#10B981" stroke-width="3"/>
