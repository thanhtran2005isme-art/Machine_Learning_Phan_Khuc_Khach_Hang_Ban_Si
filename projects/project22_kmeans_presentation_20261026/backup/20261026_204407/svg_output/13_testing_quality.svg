<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <g id="header" data-pptx-bounds="60 50 1160 80">
    <text x="60" y="90" font-size="42" font-weight="bold" fill="#1F2937">Kiểm Thử và Đảm Bảo Chất Lượng</text>
    <rect x="60" y="105" width="120" height="4" rx="2" fill="url(#accentBar)"/>
  </g>
  
  <!-- Overall Status -->
  <g id="overall-status" data-pptx-bounds="60 160 1160 80">
    <rect x="60" y="160" width="1160" height="80" rx="12" fill="url(#successGradient)"/>
    <use data-icon="phosphor-duotone/check-circle" x="90" y="185" width="50" height="50" fill="#FFFFFF"/>
    <text x="160" y="200" font-size="28" font-weight="bold" fill="#FFFFFF">
      Comprehensive Testing: 64/64 E2E Tests PASS
    </text>
    <text x="160" y="230" font-size="20" fill="#D1FAE5">
      All layers verified across desktop &amp; mobile platforms
    </text>
  </g>
  
  <!-- Gate 6 Card -->
