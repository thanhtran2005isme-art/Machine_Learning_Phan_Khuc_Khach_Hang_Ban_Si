      <use data-icon="phosphor-duotone/check-circle" x="490" y="395" width="24" height="24" fill="#10B981"/>
      <text x="525" y="415">Python ↔ Node parity 1/1</text>
    </g>
  </g>
  
  <!-- Gate 8 Card -->
