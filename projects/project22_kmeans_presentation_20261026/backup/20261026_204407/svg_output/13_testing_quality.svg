    <rect x="460" y="270" width="360" height="180" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <rect x="460" y="270" width="360" height="50" rx="12" fill="#10B981"/>
    <text x="490" y="303" font-size="20" font-weight="bold" fill="#FFFFFF">Gate 7 — End-to-End</text>
    
    <g id="gate7-results" font-size="16" fill="#1F2937">
      <use data-icon="phosphor-duotone/check-circle" x="490" y="335" width="24" height="24" fill="#10B981"/>
      <text x="525" y="355">40/40 Playwright tests</text>
      
      <use data-icon="phosphor-duotone/check-circle" x="490" y="365" width="24" height="24" fill="#10B981"/>
