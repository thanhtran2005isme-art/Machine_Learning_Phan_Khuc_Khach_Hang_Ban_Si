      <text x="125" y="355">19/19 native serving tests</text>
      
      <use data-icon="phosphor-duotone/check-circle" x="90" y="365" width="24" height="24" fill="#10B981"/>
      <text x="125" y="385">16/16 Fastify API tests</text>
      
      <use data-icon="phosphor-duotone/check-circle" x="90" y="395" width="24" height="24" fill="#10B981"/>
      <text x="125" y="415">TypeScript &amp; Vite build</text>
    </g>
  </g>
  
  <!-- Gate 7 Card -->
