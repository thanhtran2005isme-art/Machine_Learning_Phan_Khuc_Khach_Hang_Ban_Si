    </g>
  </g>
  
  <!-- Security &amp; Integrity Card -->
  <g id="security" data-pptx-bounds="660 480 560 160">
    <rect x="660" y="480" width="560" height="160" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
