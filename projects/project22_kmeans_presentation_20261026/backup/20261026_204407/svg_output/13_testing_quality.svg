      <use data-icon="phosphor-duotone/check-circle" x="690" y="605" width="24" height="24" fill="#10B981"/>
      <text x="725" y="625">No unauthorized model changes</text>
    </g>
  </g>
  
  <!-- Footer -->
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="60 680 1160 30">
    <text x="60" y="700" font-size="14" fill="#9CA3AF">Project 22: K-Means Customer Segmentation</text>
    <text x="1220" y="700" font-size="14" fill="#9CA3AF" text-anchor="end">13 / 15</text>
