    <use data-icon="phosphor-duotone/warning" x="680" y="493" width="24" height="24" fill="#FFFFFF"/>
    <text x="720" y="513" font-size="20" font-weight="bold" fill="#FFFFFF">Security &amp; Data Integrity</text>
    
    <g id="security-results" font-size="16" fill="#7F1D1D">
