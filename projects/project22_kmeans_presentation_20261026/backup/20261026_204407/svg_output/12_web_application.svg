<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <g id="header" data-pptx-bounds="60 50 1160 80">
    <text x="60" y="90" font-size="42" font-weight="bold" fill="#1F2937">Ứng Dụng Web — 3 Màn Hình Chính</text>
    <rect x="60" y="105" width="120" height="4" rx="2" fill="url(#accentBar)"/>
  </g>
  
  <!-- Screen 1: Introduction -->
  <g id="screen1" data-pptx-bounds="60 160 360 420">
    <rect x="60" y="160" width="360" height="420" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#softShadow)"/>
    
    <!-- Screen mockup -->
    <rect x="70" y="170" width="340" height="40" rx="8" fill="#2563EB"/>
    <text x="240" y="197" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Screen 1: Giới Thiệu</text>
    
    <!-- Content area -->
    <rect x="90" y="230" width="300" height="260" rx="8" fill="#F8F9FA"/>
    
    <use data-icon="phosphor-duotone/target" x="100" y="250" width="28" height="28" fill="#2563EB"/>
    <text x="140" y="272" font-size="14" font-weight="bold" fill="#1F2937">Bài toán và phạm vi</text>
    
    <text x="100" y="310" font-size="13" fill="#6B7280">· Data card &amp; Model card</text>
    <text x="100" y="335" font-size="13" fill="#6B7280">· Đơn vị monetary units</text>
    <text x="100" y="360" font-size="13" fill="#6B7280">· Giới hạn sử dụng</text>
    <text x="100" y="385" font-size="13" fill="#6B7280">· Training methodology</text>
    <text x="100" y="410" font-size="13" fill="#6B7280">· Ethical guidelines</text>
    
    <!-- Button mockup -->
    <rect x="120" y="530" width="240" height="35" rx="8" fill="#2563EB"/>
    <text x="240" y="553" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Bắt Đầu Phân Khúc →</text>
  </g>
  
  <!-- Screen 2: Segmentation -->
  <g id="screen2" data-pptx-bounds="460 160 360 420">
    <rect x="460" y="160" width="360" height="420" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#softShadow)"/>
    
    <!-- Screen mockup -->
    <rect x="470" y="170" width="340" height="40" rx="8" fill="#10B981"/>
    <text x="640" y="197" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Screen 2: Phân Khúc</text>
    
    <!-- Form mockup -->
    <rect x="490" y="230" width="300" height="260" rx="8" fill="#F8F9FA"/>
    
    <text x="500" y="255" font-size="14" font-weight="bold" fill="#1F2937">Form Input 6 Biến Chi Tiêu</text>
    
    <!-- Input fields mockup -->
    <rect x="500" y="270" width="280" height="30" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="510" y="292" font-size="12" fill="#9CA3AF">Fresh (m.u.)</text>
    
    <rect x="500" y="310" width="280" height="30" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="510" y="332" font-size="12" fill="#9CA3AF">Milk (m.u.)</text>
    
    <rect x="500" y="350" width="280" height="30" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="510" y="372" font-size="12" fill="#9CA3AF">Grocery (m.u.) ...</text>
    
    <text x="500" y="405" font-size="12" fill="#6B7280">✓ Real-time validation</text>
    <text x="500" y="425" font-size="12" fill="#6B7280">✓ Lưu lịch sử (100 records)</text>
    <text x="500" y="445" font-size="12" fill="#6B7280">✓ CSV batch import/export</text>
    
    <!-- Result preview -->
    <rect x="500" y="460" width="280" height="20" rx="4" fill="#DCFCE7"/>
    <text x="510" y="475" font-size="11" font-weight="bold" fill="#065F46">Result: Cluster ID, distance, profile</text>
    
    <!-- Button mockup -->
    <rect x="520" y="530" width="240" height="35" rx="8" fill="#10B981"/>
    <text x="640" y="553" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Phân Khúc →</text>
  </g>
  
  <!-- Screen 3: Dashboard -->
  <g id="screen3" data-pptx-bounds="860 160 360 420">
    <rect x="860" y="160" width="360" height="420" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#softShadow)"/>
    
    <!-- Screen mockup -->
    <rect x="870" y="170" width="340" height="40" rx="8" fill="#8B5CF6"/>
    <text x="1040" y="197" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Screen 3: Dashboard</text>
    
    <!-- Dashboard mockup -->
    <rect x="890" y="230" width="300" height="260" rx="8" fill="#F8F9FA"/>
    
    <text x="900" y="255" font-size="14" font-weight="bold" fill="#1F2937">Analytics &amp; Visualization</text>
    
    <!-- Chart mockups -->
    <rect x="900" y="270" width="135" height="80" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
    <text x="967" y="290" font-size="11" fill="#1E40AF" text-anchor="middle">Cluster</text>
    <text x="967" y="305" font-size="11" fill="#1E40AF" text-anchor="middle">Sizes</text>
    <circle cx="967" cy="330" r="20" fill="#2563EB" fill-opacity="0.3"/>
    
    <rect x="1055" y="270" width="135" height="80" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
    <text x="1122" y="290" font-size="11" fill="#065F46" text-anchor="middle">Medians</text>
    <rect x="1070" y="305" width="35" height="40" fill="#10B981" fill-opacity="0.3"/>
    <rect x="1110" y="315" width="35" height="30" fill="#10B981" fill-opacity="0.3"/>
    <rect x="1150" y="320" width="35" height="25" fill="#10B981" fill-opacity="0.3"/>
    
    <!-- Features list -->
    <text x="900" y="375" font-size="12" fill="#6B7280">✓ Channel/Region composition</text>
    <text x="900" y="395" font-size="12" fill="#6B7280">✓ Experiment explorer (K2-8)</text>
    <text x="900" y="415" font-size="12" fill="#6B7280">✓ PCA 2D visualization</text>
    <text x="900" y="435" font-size="12" fill="#6B7280">✓ Distance outliers</text>
    <text x="900" y="455" font-size="12" fill="#6B7280">✓ Raw vs Log1p comparison</text>
    
    <!-- Live indicator -->
    <circle cx="980" cy="545" r="6" fill="#10B981"/>
    <text x="995" y="550" font-size="13" font-weight="bold" fill="#065F46">Live: localhost:5173</text>
  </g>
  
  <!-- Bottom highlight -->
  <g id="highlight" data-pptx-bounds="60 600 1160 50">
    <rect x="60" y="600" width="1160" height="50" rx="10" fill="#EFF6FF"/>
    <use data-icon="phosphor-duotone/check-circle" x="80" y="610" width="30" height="30" fill="#10B981"/>
    <text x="125" y="632" font-size="18" font-weight="bold" fill="#1E40AF">
      Full working application from input to insights — Ready for demo
    </text>
  </g>
  
  <!-- Footer -->
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="60 680 1160 30">
    <text x="60" y="700" font-size="14" fill="#9CA3AF">Project 22: K-Means Customer Segmentation</text>
    <text x="1220" y="700" font-size="14" fill="#9CA3AF" text-anchor="end">12 / 15</text>
  </g>
</svg>