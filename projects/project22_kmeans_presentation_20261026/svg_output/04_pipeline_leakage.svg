<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <g id="header" data-pptx-bounds="60 50 1160 80">
    <text x="60" y="90" font-size="42" font-weight="bold" fill="#1F2937">Pipeline Machine Learning &amp; Tránh Data Leakage</text>
    <rect x="60" y="105" width="120" height="4" rx="2" fill="url(#accentBar)"/>
  </g>
  
  <!-- Critical Rule -->
  <g id="critical-rule" data-pptx-bounds="60 160 1160 90">
    <rect x="60" y="160" width="1160" height="90" rx="12" fill="#DCFCE7" stroke="#10B981" stroke-width="3"/>
    <use data-icon="phosphor-duotone/warning" x="80" y="185" width="40" height="40" fill="#059669"/>
    <text x="140" y="200" font-size="20" font-weight="bold" fill="#065F46">Critical Rule</text>
    <text x="140" y="230" font-size="22" fill="#064E3B">
      Split train/validation/test <tspan font-weight="bold" fill="#059669">TRƯỚC</tspan> mọi preprocessing học từ dữ liệu
    </text>
  </g>
  
  <!-- Pipeline Flow -->
  <g id="pipeline-flow" data-pptx-bounds="60 280 1160 230">
    <!-- Step 1: Raw Data -->
    <rect x="60" y="280" width="160" height="80" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="2"/>
    <text x="140" y="315" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Raw UCI Data</text>
    <text x="140" y="340" font-size="14" fill="#6B7280" text-anchor="middle">440 customers</text>
    
    <!-- Arrow -->
    <path d="M 220 320 L 250 320" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 2: SPLIT (Critical) -->
    <rect x="250" y="280" width="180" height="80" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
    <text x="340" y="310" font-size="18" font-weight="bold" fill="#1E40AF" text-anchor="middle">SPLIT</text>
    <text x="340" y="335" font-size="14" fill="#1E3A8A" text-anchor="middle">264 train / 88 val</text>
    <text x="340" y="355" font-size="14" fill="#1E3A8A" text-anchor="middle">88 test (seed 42)</text>
    
    <!-- Arrow -->
    <path d="M 430 320 L 460 320" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 3: Preprocessing -->
    <rect x="460" y="280" width="200" height="80" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="2"/>
    <text x="560" y="310" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Fit Preprocessing</text>
    <text x="560" y="335" font-size="14" fill="#6B7280" text-anchor="middle">log1p + StandardScaler</text>
    <text x="560" y="355" font-size="13" fill="#10B981" text-anchor="middle">on train only ✓</text>
    
    <!-- Arrow -->
    <path d="M 660 320 L 690 320" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 4: K-Means -->
    <rect x="690" y="280" width="180" height="80" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="2"/>
    <text x="780" y="310" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">K-Means</text>
    <text x="780" y="335" font-size="14" fill="#6B7280" text-anchor="middle">Fit on train</text>
    <text x="780" y="355" font-size="14" fill="#6B7280" text-anchor="middle">K=2..8, seed 42..51</text>
    
    <!-- Arrow -->
    <path d="M 870 320 L 900 320" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 5: Validation -->
    <rect x="900" y="280" width="160" height="80" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="2"/>
    <text x="980" y="310" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Validation</text>
    <text x="980" y="335" font-size="14" fill="#6B7280" text-anchor="middle">Choose K</text>
    <text x="980" y="355" font-size="14" fill="#6B7280" text-anchor="middle">&amp; config</text>
    
    <!-- Arrow -->
    <path d="M 1060 320 L 1090 320" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
    
    <!-- Step 6: Test ONCE -->
    <rect x="1090" y="280" width="130" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
    <text x="1155" y="310" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Test</text>
    <text x="1155" y="335" font-size="14" fill="#7F1D1D" text-anchor="middle">ONCE</text>
    <text x="1155" y="355" font-size="13" fill="#7F1D1D" text-anchor="middle">Final report</text>
    
    <!-- Result Box -->
    <rect x="60" y="400" width="1160" height="100" rx="12" fill="#F0FDF4"/>
    <use data-icon="phosphor-duotone/check-circle" x="80" y="425" width="36" height="36" fill="#10B981"/>
    <text x="130" y="445" font-size="18" font-weight="bold" fill="#065F46">Result</text>
    <text x="130" y="475" font-size="17" fill="#064E3B">
      Test độc lập, không dùng để chọn K hay tham số → Clean evaluation ✓
    </text>
  </g>
  
  <!-- Key Points -->
  <g id="key-points" data-pptx-bounds="60 530 1160 110">
    <text x="60" y="555" font-size="18" font-weight="bold" fill="#1F2937">Key Points:</text>
    <text x="60" y="585" font-size="16" fill="#1F2937">
      · Split ratio: 60% / 20% / 20% (264 / 88 / 88 samples)
    </text>
    <text x="60" y="615" font-size="16" fill="#1F2937">
      · All preprocessing parameters learned from train only, then applied to val/test
    </text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  
  <!-- Footer -->
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="60 680 1160 30">
    <text x="60" y="700" font-size="14" fill="#9CA3AF">Project 22: K-Means Customer Segmentation</text>
    <text x="1220" y="700" font-size="14" fill="#9CA3AF" text-anchor="end">4 / 15</text>
  </g>
</svg>