    <g id="status-content">
      <text x="640" y="600" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        ✓ Gate 9.6: Final Code CI Verified
      </text>
      <text x="640" y="635" font-size="20" fill="#D1FAE5" text-anchor="middle">
        Model D011 FROZEN · Ready for Academic Submission
      </text>
    </g>
  </g>
  
  <!-- Footer -->
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="60 680 1160 30">
    <text x="640" y="700" font-size="16" font-weight="bold" fill="#065F46" text-anchor="middle">Thank You · Questions?</text>
