    </g>
    
    <g id="achievement-5">
      <rect x="457" y="390" width="365" height="70" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
      <use data-icon="phosphor-duotone/check-circle" x="472" y="410" width="30" height="30" fill="#10B981"/>
      <text x="517" y="433" font-size="16" fill="#065F46">
        <tspan font-weight="bold">Frozen model</tspan> serving
      </text>
    </g>
    
    <g id="achievement-6">
      <rect x="855" y="390" width="365" height="70" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
      <use data-icon="phosphor-duotone/check-circle" x="870" y="410" width="30" height="30" fill="#10B981"/>
      <text x="915" y="433" font-size="16" fill="#065F46">
        <tspan font-weight="bold">64/64 E2E tests</tspan> PASS
      </text>
    </g>
    
    <!-- Row 3 -->
    <g id="achievement-7">
      <rect x="60" y="480" width="365" height="70" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
      <use data-icon="phosphor-duotone/check-circle" x="75" y="500" width="30" height="30" fill="#10B981"/>
      <text x="120" y="523" font-size="16" fill="#065F46">
        <tspan font-weight="bold">Data &amp; Model cards</tspan> complete
      </text>
    </g>
    
