    <g id="achievement-1">
      <rect x="60" y="300" width="365" height="70" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
      <use data-icon="phosphor-duotone/check-circle" x="75" y="320" width="30" height="30" fill="#10B981"/>
      <text x="120" y="343" font-size="16" fill="#065F46">
        <tspan font-weight="bold">440 customers</tspan> → 2 stable clusters
