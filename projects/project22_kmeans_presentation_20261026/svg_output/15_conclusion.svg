  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Hero background -->
  <rect x="0" y="0" width="1280" height="280" fill="#DCFCE7"/>
  
  <!-- Header -->
