      <rect x="457" y="480" width="365" height="70" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
      <use data-icon="phosphor-duotone/check-circle" x="472" y="500" width="30" height="30" fill="#10B981"/>
      <text x="517" y="523" font-size="16" fill="#065F46">
