<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="10" fill="#0B3C5D"/>
  <text x="80" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#14537C" text-anchor="start">QUY TRÌNH</text>
  <text x="80" y="72" font-family="Arial" font-size="34" font-weight="bold" fill="#0B3C5D" text-anchor="start">Đóng băng mô hình D011 — test không chạm fit</text>
  <rect x="80" y="102" width="56" height="5" fill="#2E86AB"/>
  <g fill="#1A1A1A" font-family="Arial">
    <rect x="120" y="170" width="300" height="70" rx="10" fill="#E9ECEF"/>
    <text x="270" y="190" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">1 · Chọn K=2</text>
    <text x="270" y="216" font-size="14" fill="#1A1A1A" text-anchor="middle">D011 trên train/validation</text>
    <line x1="430" y1="205" x2="480" y2="205" stroke="#2E86AB" stroke-width="3"/>
    <polygon points="480,198 490,205 480,212" fill="#2E86AB"/>
    <rect x="490" y="170" width="300" height="70" rx="10" fill="#E9ECEF"/>
    <text x="640" y="190" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">2 · Freeze selection.json</text>
    <text x="640" y="216" font-size="14" fill="#1A1A1A" text-anchor="middle">Trước khi mở test</text>
    <line x1="800" y1="205" x2="850" y2="205" stroke="#2E86AB" stroke-width="3"/>
    <polygon points="850,198 860,205 850,212" fill="#2E86AB"/>
    <rect x="860" y="170" width="300" height="70" rx="10" fill="#E9ECEF"/>
    <text x="1010" y="190" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">3 · Fit trên 352 mẫu</text>
    <text x="1010" y="216" font-size="14" fill="#1A1A1A" text-anchor="middle">train+validation → model.joblib</text>
  </g>
  <g fill="#1A1A1A" font-family="Arial">
    <rect x="120" y="330" width="300" height="70" rx="10" fill="#E9ECEF"/>
    <text x="270" y="350" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">4 · Đánh giá test 88 mẫu</text>
    <text x="270" y="376" font-size="14" fill="#1A1A1A" text-anchor="middle">Một lần, sau freeze</text>
    <line x1="430" y1="365" x2="480" y2="365" stroke="#2E86AB" stroke-width="3"/>
    <polygon points="480,358 490,365 480,372" fill="#2E86AB"/>
    <rect x="490" y="330" width="300" height="70" rx="10" fill="#E9ECEF"/>
    <text x="640" y="350" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">5 · final_evaluation.json</text>
    <text x="640" y="376" font-size="14" fill="#1A1A1A" text-anchor="middle">status COMPLETE, test một lần</text>
    <line x1="800" y1="365" x2="850" y2="365" stroke="#2E86AB" stroke-width="3"/>
    <polygon points="850,358 860,365 850,372" fill="#2E86AB"/>
    <rect x="860" y="330" width="300" height="70" rx="10" fill="#E9ECEF"/>
    <text x="1010" y="350" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">6 · Serving chỉ infer</text>
    <text x="1010" y="376" font-size="14" fill="#1A1A1A" text-anchor="middle">Không retrain, không fit lại</text>
  </g>
  <text x="80" y="450" font-family="Arial" font-size="15" fill="#6B7280" text-anchor="start">Test 88 mẫu được khóa trước freeze; không tham gia chọn K, seed, tiền xử lý hay đặt tên cụm. serving chỉ log1p(x) + scaler đã lưu + nearest centroid.</text>
  <text x="1200" y="704" font-family="Arial" font-size="13" fill="#6B7280" text-anchor="end">Project 22 · P06</text>
</svg>