name: Gate 7 E2E and Parity
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: npm ci
      - name: Install Playwright runner without editing frozen npm lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install "numpy>=2,<3" "scikit-learn>=1.5,<2" "joblib>=1.4,<2"
      - name: Compare Python sklearn and Node inference on synthetic inputs
        run: npm run test:parity
      - name: Browser E2E desktop and mobile
        run: npm run test:e2e
      - name: Record dependency advisory details
        if: always()
        run: |
          npm audit --json > /tmp/gate7-audit.json || true
          node -e "const a=require('/tmp/gate7-audit.json'); console.log('AUDIT', JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.fromEntries(Object.entries(a.vulnerabilities||{}).map(([k,v])=>[k,{severity:v.severity,isDirect:v.isDirect,fixAvailable:v.fixAvailable}]))},null,2))"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gate7-playwright-evidence
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
