name: Gate 10 Feature Branch Verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:gate6
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install "numpy>=2,<3" "scikit-learn>=1.5,<2" "joblib>=1.4,<2"
      - run: npm run test:parity
      - run: npm run test:e2e
