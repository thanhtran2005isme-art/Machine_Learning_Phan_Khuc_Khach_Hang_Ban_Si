name: Gate 9.6 Cold Reproducibility and Final ML Audit
on:
  push:
    branches: [main]
    paths:
      - ml/src/verify_cold_repro.py
      - .github/workflows/gate9-6-cold-audit.yml
      - ml/src/prepare_development_only.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install declared ML environment from a clean runner
        run: python -m pip install -r ml/requirements.txt
      - name: Assert held-out test is absent and model is immutable
        shell: python
        run: |
          from pathlib import Path
          assert not Path('data/processed/test.csv').exists(), 'Held-out test file exists'
          assert Path('models/model.json').exists(), 'No frozen serving artifact'
      - name: Download audited UCI raw
        run: python -m ml.src.download_data
      - name: Materialize train/validation ONLY and verify frozen hashes
        run: python -m ml.src.prepare_development_only
      - name: Run Gate 9.2 predict-only profile/parity and Gate 4 unit checks
        run: python -m pytest ml/tests/test_experiments.py ml/tests/test_review_experiments.py ml/tests/test_final_profile.py -q
      - name: Cold replay all 140 runs and 630 ARI comparisons in isolated temp, validate D011 evidence
        run: python -m ml.src.verify_cold_repro
      - name: Check repo evidence and frozen artifact remain unchanged
        shell: bash
        run: |
          git diff --exit-code -- models reports/data/experiments reports/data/final_profile
          test ! -f data/processed/test.csv
